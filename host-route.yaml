apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: material-dil-grafana
  namespace: infra-gateway
  labels:
    app.kubernetes.io/managed-by: codex
    management-api/tenant: material
spec:
  hostnames:
    - grafana.material.dil.collab-cloud.eu
  parentRefs:
    - name: infra
      namespace: infra-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dil-grafana-x-dil-grafana-x-material
          namespace: loft-material-v-material
          port: 3000
