image:
  repository: grafana/grafana
  tag: "13.0.1"
  pullPolicy: IfNotPresent
imagePullSecrets: []
plugin:
  enabled: true
  packages:
    - id: dataspacelab-dil-datasource
      version: "0.3.5"
      zipUrl: "https://github.com/Data-Space-Core/DIL-Grafana-Plugin-source/releases/download/v0.3.6/dataspacelab-dil-datasource-0.3.5.zip"
    - id: dataspacelab-dil-dashboard-app
      version: "0.1.3"
      zipUrl: "https://github.com/Data-Space-Core/DIL-Grafana-Plugin-source/releases/download/v0.3.5/dataspacelab-dil-dashboard-app-0.1.3.zip"
# Must contain admin-user, admin-password, connector-token. Do not commit secrets.
existingSecret: dil-grafana-credentials
service:
  port: 3000
grafana:
  rootUrl: "https://grafana.material.dil.collab-cloud.eu/"
  installPlugins:
    - ae3e-plotly-panel
  allowUnsignedPlugin: true
  allowUnsignedPlugins:
    - dataspacelab-dil-datasource
    - dataspacelab-dil-dashboard-app
  oauth:
    enabled: true
    clientId: dil-grafana
    issuerUrl: "https://dil.collab-cloud.eu/auth/realms/material"
    scopes: "openid profile email"
    allowSignUp: true
    usePkce: true
    autoLogin: true
datasource:
  enabled: false
  uid: dil-dataspace
  name: DIL Dataspace
  # Consumer dataplane origin, without /grafana/consumer.
  connectorUrl: ""
  agreementId: ""
  datasetId: ""
  offerId: ""
  dashboardId: ""
persistence:
  enabled: true
  size: 5Gi
  storageClassName: ""
resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 100m
    memory: 768Mi
    ephemeral-storage: 1Gi
ingress:
  enabled: false
  className: ""
  hostname: ""
  tlsSecretName: ""
  annotations: {}
